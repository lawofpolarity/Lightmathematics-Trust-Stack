name: Disposable no-funds integration
on:
  workflow_dispatch:
  push:
    paths:
      - 'rehearsals/transaction-001c/**'
      - '.github/workflows/transaction-001c-no-funds.yml'
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: rehearsal
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Database schema
        env:
          PGPASSWORD: testonly
        run: psql -h localhost -U postgres -d rehearsal -v ON_ERROR_STOP=1 -f rehearsals/transaction-001c/schema.sql
      - name: Install Deno npm dependency for disposable verifier
        run: deno install --node-modules-dir=auto --allow-scripts npm:postgres@3.4.7
      - name: Start verifier
        env:
          DATABASE_URL: postgres://lm_rehearsal_app:disposable-only@localhost:5432/rehearsal
        run: |
          deno run --node-modules-dir=auto -A rehearsals/transaction-001c/server.ts > /tmp/lm-verifier.log 2>&1 &
          echo $! > /tmp/lm-verifier.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health; then break; fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:8787/health; then
            echo "::error::Deno verifier failed to become ready; startup log follows"
            cat /tmp/lm-verifier.log
            exit 1
          fi
      - name: Run tests
        env:
          ADMIN_DATABASE_URL: postgres://postgres:testonly@localhost:5432/rehearsal
          UNTRUSTED_DATABASE_URL: postgres://lm_rehearsal_untrusted:disposable-only@localhost:5432/rehearsal
        run: deno test --node-modules-dir=auto -A rehearsals/transaction-001c/integration_test.ts
      - name: Restart verifier and assert replay still rejected
        env:
          DATABASE_URL: postgres://lm_rehearsal_app:disposable-only@localhost:5432/rehearsal
        run: |
          kill "$(cat /tmp/lm-verifier.pid)"
          for i in $(seq 1 20); do
            if ! kill -0 "$(cat /tmp/lm-verifier.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
          deno run --node-modules-dir=auto -A rehearsals/transaction-001c/server.ts > /tmp/lm-verifier-restarted.log 2>&1 &
          echo $! > /tmp/lm-verifier-restarted.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health; then break; fi
            sleep 2
          done
          code=$(curl -s -o /tmp/lm-replay-response.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/lm-replay-payload.json \
            http://127.0.0.1:8787/v1/inspect)
          if [ "$code" != "409" ]; then
            echo "::error::Restart replay expected 409, got $code"
            cat /tmp/lm-verifier-restarted.log
            cat /tmp/lm-replay-response.json
            exit 1
          fi
          grep -q 'replay' /tmp/lm-replay-response.json
